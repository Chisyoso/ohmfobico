<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHMFÓBICO - Práctica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="practica">
<div class="practica-header">
    <a href="index.html" class="volver">← Volver</a>
    <h1>Laboratorio de Ohm</h1>
    <p class="descripcion">
        Resuelve circuitos eléctricos usando la Ley de Ohm.
    </p>
</div>
<div class="niveles">
    <button class="nivel activo" id="nivel-1" onclick="cambiarDificultad(1)">
        Fácil
    </button>
    <button class="nivel" id="nivel-2" onclick="cambiarDificultad(2)">
        Medio
    </button>
    <button class="nivel" id="nivel-3" onclick="cambiarDificultad(3)">
        Difícil
    </button>
</div>
<section class="panel-practica">
    <div class="datos-ejercicio">
        <span id="dificultad">Dificultad: Fácil</span>
        <span id="estado">Motor JavaScript activo</span>
    </div>
    <div class="circuito-visual">
        <div id="circuito">
            <p>Generando circuito...</p>
        </div>
    </div>
    <div id="preguntas">
        <div class="pregunta">
            <h2>Preguntas</h2>
            <p>Generando ejercicio...</p>
        </div>
    </div>
    <div id="resultado" class="resultado-practica"></div>
</section>

<footer class="pie">
    <p>OHMFÓBICO</p>
    <p>Laboratorio de simulación de circuitos eléctricos</p>
</footer>
</main>
<script src="prac.js"></script>
</body>
</html>
